name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, static checks first; most mistakes stop here before any test runs.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run knip
      - run: bun run build
      - name: Pack, install and run the published package
        run: bun run check:package

  # Tests run the built bundle, on both platforms and on the oldest Node that
  # package.json's engines allows.
  test:
    needs: static
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: "24" }
          - { os: macos-latest, node: "24" }
          - { os: ubuntu-latest, node: "22.12.0" }
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - run: bun run test
