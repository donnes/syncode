name: Release & Publish
run-name: "release ${{ inputs.bump }}"

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump major, minor, or patch"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      preview:
        description: "Preview: run every check and an npm publish dry run, create nothing"
        required: false
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      # Full history, so the latest version tag can be found.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Release
        id: release
        run: node scripts/release.ts
        env:
          BUMP: ${{ inputs.bump }}
          PREVIEW: ${{ inputs.preview }}
          GH_TOKEN: ${{ github.token }}

  publish:
    needs: release
    if: ${{ !inputs.preview }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: ./.github/actions/setup

      - name: Publish to npm
        run: node scripts/publish.ts
        env:
          VERSION: ${{ needs.release.outputs.version }}
