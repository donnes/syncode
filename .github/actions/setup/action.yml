name: Setup
description: Install Bun, Node and dependencies

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    # Tests run the CLI's TypeScript directly, which needs Node >= 22.18.
    # Node 24 also ships the npm needed for trusted publishing.
    - uses: actions/setup-node@v5
      with:
        node-version: 24
        registry-url: https://registry.npmjs.org

    - run: bun install --frozen-lockfile
      shell: bash
